name: Repair report action state
on:
  push:
    branches: [fix/sprint-completion-hardening-20261027]
    paths: [.github/workflows/repair-report-actions.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply bounded reviewed repair on the expected parent only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 72fd9c9a8fb90e46d5543d13460aa6ae5326b97e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/platform/app/routes/book.tsx');s=p.read_text();old='<noscript><p role="status">Enable JavaScript to check appointment availability and book a service.</p></noscript>';new='{!interactive && <p role="status">Preparing the booking form. JavaScript is required to check appointment availability and book a service.</p>}'
          assert old in s;p.write_text(s.replace(old,new))
          p=Path('tests/browser/booking-hydration.spec.ts');s=p.read_text();s=s.replace(" const staff=await browser.newContext({baseURL:origin});\n",'')
          start=s.index("  await login(staff,'review-staff@proinspect.test');");end=s.index("  const page=await noScripts.newPage();",start)
          s=s[:start]+"  const owner=await post(noScripts,'/api/onboarding',{\n   displayName:'Synthetic Hydration Owner',clientName:'Hydration portfolio '+randomUUID().slice(0,8),landlordType:'residential',\n  });\n  const base=`/w/landlord/${owner.clientId}`;\n  const property=await post(noScripts,'/api'+base+'/properties',{\n   address:randomUUID().slice(0,8)+' Hydration Street',suburb:'Perth',postcode:'6000',\n   propertyType:'House',selfManaged:true,\n  });\n"+s[end:]
          s=s.replace('Enable JavaScript to check appointment availability and book a service.','Preparing the booking form. JavaScript is required to check appointment availability and book a service.')
          s=s.replace('await noScripts.close();await staff.close();','await noScripts.close();');p.write_text(s)
          p=Path('apps/platform/app/components/InspectorFieldMode.tsx');s=p.read_text();s=s.replace('locked:boolean;dirty:boolean','locked:boolean;dirty:boolean;busy:boolean')
          s=s.replace('({draft,onChange,locked,dirty}:Props)','({draft,onChange,locked,dirty,busy}:Props)')
          s=s.replace(" const [index,setIndex]=useState(0),[message,setMessage]=useState('');"," const [index,setIndex]=useState(0),[message,setMessage]=useState('');\n const [preparing,setPreparing]=useState(false);")
          s=s.replace('  if(!selected||!target)return;',"  if(!selected||!target)return;\n  if(locked||busy||preparing||photo.state!=='idle'){setMessage('Wait for the current report action to finish before selecting another photo.');return;}")
          s=s.replace("  setMessage('Compressing and uploading","  setPreparing(true);\n  setMessage('Compressing and uploading")
          s=s.replace("'Could not prepare the camera photo.');}","'Could not prepare the camera photo.');}finally{setPreparing(false);}")
          s=s.replace('disabled={locked}','disabled={locked||busy}')
          s=s.replace("disabled={locked||photo.state!=='idle'}","disabled={locked||busy||dirty||preparing||photo.state!=='idle'}")
          s=s.replace('<select value={active}','<select disabled={busy||preparing} value={active}')
          s=s.replace('disabled={active===0}','disabled={busy||preparing||active===0}').replace('disabled={active===targets.length-1}','disabled={busy||preparing||active===targets.length-1}')
          p.write_text(s)
          p=Path('apps/platform/app/routes/report-detail.tsx');s=p.read_text()
          s=s.replace(" const [fieldMode,setFieldMode]=useState(false);\n useEffect(()=>{setFieldMode(window.matchMedia('(max-width: 680px)').matches);},[]);"," const [fieldMode,setFieldMode]=useState(false),[interactive,setInteractive]=useState(false);\n const navigation=useNavigation(),busy=!interactive||navigation.state!=='idle';\n useEffect(()=>{setFieldMode(window.matchMedia('(max-width: 680px)').matches);setInteractive(true);},[]);")
          s=s.replace('<Form method="post" className="stack">','<Form method="post" className="stack" aria-busy={busy}>',1)
          s=s.replace('disabled={locked}','disabled={locked||busy}')
          s=s.replace('locked={locked} dirty={dirty}','locked={locked} dirty={dirty} busy={busy}')
          s=s.replace('aria-pressed={fieldMode} onClick=','aria-pressed={fieldMode} disabled={busy} onClick=')
          s=s.replace('type="button" onClick={()=>addComponent(ai)}','type="button" disabled={busy} onClick={()=>addComponent(ai)}')
          s=s.replace('className="button secondary" onClick={addArea}','className="button secondary" disabled={busy} onClick={addArea}')
          s=s.replace('<button className="primary">Save draft','<button className="primary" disabled={busy}>Save draft')
          s=s.replace('<input type="file" name="file" accept="image/jpeg" required/>','<input type="file" name="file" accept="image/jpeg" disabled={busy||dirty} required/>')
          s=s.replace('<button className="button secondary small">Upload area evidence</button>','<button className="button secondary small" disabled={busy||dirty}>Upload area evidence</button>')
          p.write_text(s)
          p=Path('tests/browser/reporting.spec.ts');s=p.read_text()
          s=s.replace("  await page.getByRole('button',{name:/Save draft/}).click();","  const photo=page.getByLabel('Take or select evidence photo');\n  await expect(photo).toBeDisabled();\n  await page.getByRole('button',{name:/Save draft/}).click();")
          s=s.replace("  const photo=page.getByLabel('Take or select evidence photo');\n  await photo.setInputFiles","  // File selection is programmatic: require the same enabled state a human needs.\n  await expect(photo).toBeEnabled();\n  await photo.setInputFiles")
          p.write_text(s)
          PY
          git diff --check
          git add apps/platform/app/components/InspectorFieldMode.tsx apps/platform/app/routes/book.tsx apps/platform/app/routes/report-detail.tsx tests/browser/booking-hydration.spec.ts tests/browser/reporting.spec.ts
          git rm --cached .github/workflows/repair-report-actions.yml
          test "$(git write-tree)" = 37773eb60a41b9ba603b020c0cd7f78a8cdc914f
          git add .github/workflows/repair-report-actions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect booking initialization and photographic capture during report saves'
          git push origin HEAD:fix/sprint-completion-hardening-20261027
