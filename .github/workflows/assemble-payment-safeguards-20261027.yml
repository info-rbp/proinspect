name: Assemble reviewed payment safeguards
on:
  push:
    branches: [fix/sprint-payment-acceptance-safeguards-20261027]
    paths: [.github/workflows/assemble-payment-safeguards-20261027.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only hash-verified source edits to the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/sprint-payment-acceptance-safeguards-20261027
          test "$(git merge-base HEAD 25ed21b8c768b75dcba7a182f758ad4404abd752)" = 25ed21b8c768b75dcba7a182f758ad4404abd752
          gh api repos/info-rbp/proinspect/git/blobs/82d6be64d63cc169957cedacc71118b75c6d17bc --jq .content | base64 --decode > /tmp/source-edits.gz
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          raw=pathlib.Path('/tmp/source-edits.gz').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='96a281376e5e5849511fa1cc0fc0a3e3b044c528337c2e0e85cf4531b7695bc8'
          items=json.loads(gzip.decompress(raw))
          assert len(items)==18
          for item in items:
              path=pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ['apps','packages','scripts','tests','config','docs']
              assert not path.is_symlink()
              old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==item['before'],str(path)
              text=old
              for start,end,insert in reversed(item['edits']):
                  assert 0<=start<=end<=len(old)
                  text=text[:start]+insert+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['after'],str(path)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text)
          PY
          git add apps packages scripts tests config docs
          cp .git/index /tmp/verified-source-index
          GIT_INDEX_FILE=/tmp/verified-source-index git update-index --force-remove .github/workflows/assemble-payment-safeguards-20261027.yml
          test "$(GIT_INDEX_FILE=/tmp/verified-source-index git write-tree)" = b0aaa78d990bf9b0d7452859d71015833a5c3b03
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: pin sandbox portal policy, restricted credentials and real council acceptance scope'
          git push origin HEAD:fix/sprint-payment-acceptance-safeguards-20261027
