name: Eight-portal acceptance gate unit checks
on:
  pull_request:
    paths:
      - 'scripts/portal-testing/acceptance-gate.mjs'
      - 'tests/portal-acceptance-gate.test.mjs'
      - 'tests/portal-execution.test.mjs'
      - 'tests/portal-launch-evidence.test.mjs'
      - 'scripts/portal-testing/acceptance-manifest.mjs'
      - 'scripts/portal-testing/isolated-scenario-coverage.mjs'
      - 'scripts/portal-testing/verify-launch-evidence.mjs'
      - '.github/workflows/portal-acceptance-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed acceptance gate
        run: node --test tests/portal-acceptance-gate.test.mjs tests/portal-execution.test.mjs tests/portal-launch-evidence.test.mjs
