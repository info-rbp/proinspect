name: Assemble reviewed PCR completion
on:
  push:
    branches: [feature/pcr-100-launch-20261027]
    paths: [.github/workflows/assemble-pcr-completion-20261027.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile exact reviewed source without provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/pcr-100-launch-20261027
          test "$(git merge-base HEAD f9cb97db1e94c57cec73b3128c77a01ba877c21f)" = f9cb97db1e94c57cec73b3128c77a01ba877c21f
          test "$(git rev-parse 1fb09ce3d9af4b13e6fd248654a352cb55bdab17^{tree})" = b0aaa78d990bf9b0d7452859d71015833a5c3b03
          cp .github/workflows/assemble-pcr-completion-20261027.yml /tmp/assembly.yml
          git read-tree --reset -u 1fb09ce3d9af4b13e6fd248654a352cb55bdab17
          cp /tmp/assembly.yml .github/workflows/assemble-pcr-completion-20261027.yml
          n=0
          for blob in 9e0ab9dccfad06574bf31c4a7e9e2fda096620c9 80bb5c0f32e0755d9447ebc9006daeaf03b27f66 206b93005bfc570e345ee5f90a26db7978429975 407e7898eaf1d3f18e7d237c9e04e15b7b328775 dd841d2fec2f93eee0b1299ddaa1ce47aa7adf68 0d18450b9787db7551feed7d7ba414d3975f9b23 2063108f54917a66ac566dd9412aef0cefdd1c7d; do
            gh api "repos/info-rbp/proinspect/git/blobs/$blob" --jq .content | base64 --decode > "/tmp/pcr-part-$n"
            test "$(git hash-object /tmp/pcr-part-$n)" = "$blob"
            n=$((n+1))
          done
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib,subprocess
          chunks=[pathlib.Path('/tmp/pcr-part-'+str(i)).read_bytes() for i in range(7)]
          # Restore one verified transport-byte transcription; both hashes are mandatory.
          part=bytearray(chunks[3]);assert part[378]==104;part[378]=124
          assert hashlib.sha1(f'blob {len(part)}\0'.encode()+part).hexdigest()=='a365754740d09e38aa674e08d2081e2c42a7e972'
          chunks[3]=bytes(part);raw=b''.join(chunks)
          assert hashlib.sha256(raw).hexdigest()=='ccdf65df3d0485812d697550bc91c198ec5f73012082480989379c548562af53'
          items=json.loads(gzip.decompress(raw));assert len(items)==35
          for item in items:
              path=pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ['apps','packages','scripts','tests','config','docs','database','package.json']
              assert not path.is_symlink()
              assert item['source'] in ['base','pcr']
              if item['source']=='pcr':
                  old=subprocess.check_output(['git','show','f9cb97db1e94c57cec73b3128c77a01ba877c21f:'+str(path)]).decode()
              else:
                  old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==item['before'],str(path)
              text=old
              for start,end,insert in reversed(item['edits']):
                  assert 0<=start<=end<=len(old)
                  text=text[:start]+insert+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['after'],str(path)
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
              subprocess.check_call(['git','add','--',str(path)])
          PY
          git add .github/workflows/assemble-pcr-completion-20261027.yml
          cp .git/index /tmp/pcr-review-index
          GIT_INDEX_FILE=/tmp/pcr-review-index git update-index --force-remove .github/workflows/assemble-pcr-completion-20261027.yml
          test "$(GIT_INDEX_FILE=/tmp/pcr-review-index git write-tree)" = 33c16b59193a9e933e24a27a12758c237028e1ac
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: complete property-scoped PCR discount reservation and settlement lifecycle'
          git push origin HEAD:feature/pcr-100-launch-20261027
