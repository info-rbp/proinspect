name: V3 emergency production Worker deployment (pinned)
on:
  push:
    branches: [version-3-enhancements]
    paths: [.github/workflows/v3-production-worker-deploy.yml]
permissions:
  contents: read
concurrency:
  group: proinspect-production-worker-manual-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/version-3-enhancements'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '8ca23ac6d2cc906d4dd13b8da5ea2b25' }}
      V3_ONE_TIME_PRODUCTION_DEPLOY: verified-manual-fallback-2026-10-21
      WORKERS_CI: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin approved merged main and load immutable release guard
        shell: bash
        run: |
          set -euo pipefail
          source_sha='5c7034262bc29c99be6144bc09c198c0033838b6'
          test "$GITHUB_REF" = 'refs/heads/version-3-enhancements'
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$source_sha"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git fetch --no-tags origin version-3-enhancements
          git show FETCH_HEAD:scripts/release/v3-production-worker-deploy.mjs > scripts/release/v3-production-worker-deploy.mjs
          test "$(git hash-object scripts/release/v3-production-worker-deploy.mjs)" = '193961a88b84f1e4e02d4f22cecb6846c0be7fce'
          node --check scripts/release/v3-production-worker-deploy.mjs
      - name: Install immutable main lockfile
        run: pnpm install --frozen-lockfile
      - name: Confirm production schema, Worker bindings and credentials by names only
        run: node scripts/release/v3-production-worker-deploy.mjs prepare
      - name: Build and deploy exactly the merged main source if not already live
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat artifacts/v3-worker-deploy-needed.txt)" = '1' ]; then
            CLOUDFLARE_ENV=connected pnpm --dir apps/platform build
            node scripts/release/v3-production-worker-deploy.mjs build-check
            pnpm --dir apps/platform exec wrangler deploy --dry-run
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5c7034262bc29c99be6144bc09c198c0033838b6'
            pnpm --dir apps/platform exec wrangler deploy
          else
            echo 'Verified merged source is already deployed; no deployment required'
          fi
      - name: Independently verify production source, bindings, D1 ledger and secrets retained
        run: node scripts/release/v3-production-worker-deploy.mjs verify
      - name: Save release evidence without credentials or customer records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-production-worker-deploy-verification
          path: |
            artifacts/v3-worker-production-before.json
            artifacts/v3-worker-production-after.json
          if-no-files-found: warn
          retention-days: 14
