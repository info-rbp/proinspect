name: Connect the Cloudflare platform Worker
on:
  workflow_dispatch:
    inputs:
      confirm_worker:
        description: 'Type proinspect-platform to confirm replacing that Worker with an isolated staging build'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: proinspect-cloudflare-connected-platform
  cancel-in-progress: false
jobs:
  connect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      CONFIRM_WORKER: ${{ inputs.confirm_worker }}
      SOURCE_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
      ENQUIRY_GATEWAY_SECRET: ${{ secrets.ENQUIRY_GATEWAY_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      MARKETING_TURNSTILE_SECRET_KEY: ${{ secrets.MARKETING_TURNSTILE_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      REPORT_TOOL_SECRET: ${{ secrets.REPORT_TOOL_SECRET }}
      SHEETS_WEBHOOK_SECRET: ${{ secrets.SHEETS_WEBHOOK_SECRET }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_SINK: ${{ vars.EMAIL_SINK }}
      OPERATIONS_EMAIL: ${{ vars.OPERATIONS_EMAIL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      MARKETING_TURNSTILE_SITE_KEY: ${{ vars.MARKETING_TURNSTILE_SITE_KEY }}
      MARKETING_ORIGIN: ${{ vars.MARKETING_ORIGIN }}
      REPORT_TOOL_ORIGIN: ${{ vars.REPORT_TOOL_ORIGIN }}
      SHEETS_WEBHOOK_URL: ${{ vars.SHEETS_WEBHOOK_URL }}
      RESTRICTED_WORKFLOWS_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the exact source and required hosted configuration
        run: |
          test "$CONFIRM_WORKER" = proinspect-platform
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/configuration.mjs --check
      - name: Verify both applications and their integration contracts
        run: |
          pnpm check
          pnpm test:integration
      - name: Check existing Cloudflare Worker and provision isolated staging resources
        run: node scripts/deploy/connect-platform.mjs --prepare
      - name: Prove the new platform build before changing Cloudflare Builds
        env:
          CLOUDFLARE_ENV: connected
        run: |
          pnpm --dir apps/platform build
          pnpm --dir apps/platform exec wrangler deploy --dry-run
      - name: Apply migrations and safe request-mode service catalogue to the new database
        run: |
          pnpm --dir apps/platform exec wrangler d1 migrations apply DB --env connected --remote --yes
          pnpm catalogue:sql
          pnpm --dir apps/platform exec wrangler d1 execute DB --env connected --remote --file ../../artifacts/catalogue.sql --yes
          pnpm --dir apps/platform exec wrangler d1 execute DB --env connected --remote --command "INSERT INTO schedule_resources(id,name,active) VALUES('default','ProInspect inspection capacity',1) ON CONFLICT(id) DO NOTHING;" --yes
      - name: Install missing Worker secrets and correct the existing main branch build trigger
        run: node scripts/deploy/connect-platform.mjs --configure
      - name: Record the actual D1 ID in source and push the verified configuration to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform/wrangler.jsonc
          if ! git diff --cached --quiet; then
            git commit -m 'build: bind proinspect-platform to isolated Cloudflare staging resources'
            git push origin HEAD:main
          fi
      - name: Request Cloudflare to build the exact committed main revision
        run: node scripts/deploy/connect-platform.mjs --trigger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-connected-platform-receipt
          path: artifacts/connected-platform.json
          retention-days: 14