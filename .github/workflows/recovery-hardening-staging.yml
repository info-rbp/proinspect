name: Sprint recovery isolated staging
on:
  push:
    branches: [ops/sprint-recovery-20261027]
    paths: [.github/workflows/recovery-hardening-staging.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: proinspect-staging-release
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: e0ee9c410ad320e2f0bacbf85c4192d4f5de4b9e
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      CLOUDFLARE_ENV: ''
      WORKERS_CI: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve reviewed isolated operations helper
        run: cp ops/final-sprint-staging.mjs /tmp/final-sprint-staging.mjs
      - uses: actions/checkout@v4
        with:
          ref: e0ee9c410ad320e2f0bacbf85c4192d4f5de4b9e
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact reviewed source and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = 33b73fa64bd3bdcad0393153c50d73bda06618c6
          test -z "$(git diff --name-only 82fe6d236885d18e2baac4a7923272c0d7503762 HEAD -- database/migrations)"
          for attempt in $(seq 1 60); do
            result=$(gh api repos/info-rbp/proinspect/actions/runs/40432734547 --jq '[.head_sha,.status,(.conclusion // "pending")] | @tsv')
            test "$(printf '%s' "$result" | cut -f1)" = "$SOURCE_SHA"
            if [ "$(printf '%s' "$result" | cut -f2)" = completed ]; then
              test "$(printf '%s' "$result" | cut -f3)" = success
              exit 0
            fi
            sleep 15
          done
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build without deployment credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler --version
          node /tmp/final-sprint-staging.mjs prepare
          pnpm --dir apps/platform build
          pnpm --dir apps/platform exec wrangler deploy --dry-run
          pnpm exec playwright install --with-deps chromium
      - name: Verify isolated staging identity, recovery point and unchanged schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node /tmp/final-sprint-staging.mjs before
          node /tmp/final-sprint-staging.mjs after-schema
      - name: Deploy only to the existing isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir apps/platform exec wrangler deploy --keep-vars
          node /tmp/final-sprint-staging.mjs after-deploy
      - name: Read-only responsive staging observations
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '@playwright/test';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch(),checks=[];
          try {for(const width of [320,390,1100,1440]){
            const page=await browser.newPage({viewport:{width,height:950}});
            for(const path of ['/','/services','/book','/guest/book','/signin','/privacy']){
              const r=await page.goto('https://proinspect-v3-staging.delicate-dream-e4c9.workers.dev'+path,{waitUntil:'networkidle'});
              assert.ok(r&&r.status()<500,path);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false,`${width} ${path}`);
              checks.push({width,path,status:r.status()});
            }
            await page.screenshot({path:`artifacts/recovery-staging-${width}.png`,fullPage:true});
            await page.close();
          }}finally{await browser.close();}
          writeFileSync('artifacts/recovery-staging-browser.json',JSON.stringify({source:process.env.SOURCE_SHA,checks,authenticatedAcceptance:false,providerAcceptance:false},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-recovery-staging-evidence
          path: artifacts/
          retention-days: 30
