name: Apply verified handbook source snapshot
on:
  push:
    branches: [feature/final-sprint-handbook-20261027]
    paths: [.github/workflows/final-sprint-apply.yml, '_handoff/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/feature/final-sprint-handbook-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-sprint-handbook-20261027
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the exact locally tested patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess
          root = pathlib.Path('.')
          baseline = 'b633b75ce2a75b84848c780eba0a82d559755518'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          parts = sorted(root.glob('_handoff/part-*.b64'))
          assert len(parts) == 13, 'Unexpected payload parts'
          text = []
          for i,p in enumerate(parts):
              assert p.name == f'part-{i:02}.b64'
              value = p.read_text()
              if i == 1:
                  # Correct one identified transport insertion before cryptographic verification.
                  assert value.count('Mbtxcc/l/lXp1') == 1
                  value = value.replace('Mbtxcc/l/lXp1','Mbtxcc/lXp1')
              text.append(value)
          encoded = ''.join(text)
          assert len(encoded) == 98104
          compressed = base64.b64decode(encoded,validate=True)
          assert len(compressed) == 73576
          assert hashlib.sha256(compressed).hexdigest() == '20ec8364e6077287b73a57bd766b405a5d1feaaae0d8ab4052f1f110dcd06903'
          patch = lzma.decompress(compressed)
          assert len(patch) == 411158
          assert hashlib.sha256(patch).hexdigest() == 'cc833cd495fb937803ff4f8a1d15175da16db40ba7c0f4994cdb7231fb34ef6d'
          names = re.findall(r'^diff --git a/(.+) b/(.+)$',patch.decode(),re.M)
          assert len(names) == 28
          for old,new in names:
              assert old == new and '..' not in pathlib.PurePosixPath(new).parts
              assert new.startswith(('apps/','packages/','tests/','docs/handbook/','config/handbook-','scripts/handbook-')) or new in ['package.json','database/migrations/0047_commercial_source_lifecycle.sql'], new
          tmp = pathlib.Path('/tmp/verified-handbook.patch')
          tmp.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(tmp)],check=True)
          subprocess.run(['git','apply','--index',str(tmp)],check=True)
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == {new for _,new in names}
          subprocess.run(['git','diff','--cached','--check'],check=True)
          manifest = {p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(actual)}
          pathlib.Path('/tmp/handbook-source-hashes.json').write_text(json.dumps(manifest,indent=2))
          print('Verified exact 411158-byte patch and all 28 changed source paths.')
          PY
      - name: Validate all handbook contracts and immutable deployed migrations
        run: node scripts/handbook-check.mjs
      - name: Commit source only to the dedicated implementation branch
        run: |
          git rm -r _handoff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement reviewed commercial lifecycle and offline evidence hardening' -m 'Partial handbook engineering only. O05-O08, partial R05, and 110-task evidence register. Patch SHA256 cc833cd495fb937803ff4f8a1d15175da16db40ba7c0f4994cdb7231fb34ef6d. No production release or independent acceptance.'
          git push origin HEAD:refs/heads/feature/final-sprint-handbook-20261027
          git rev-parse HEAD > /tmp/handbook-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-handbook-source-handoff
          path: |
            /tmp/handbook-source-hashes.json
            /tmp/handbook-source-commit.txt
          retention-days: 7
