name: Assemble resumed final sprint
on:
  push:
    branches: [integration/final-platform-release-20261026]
    paths: [.github/workflows/assemble-resumed-sprint.yml]
permissions:
  contents: write
concurrency:
  group: final-sprint-source-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct content-addressed source and require exact tree
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = integration/final-platform-release-20261026
          test "$(git rev-parse origin/main)" = 9e5ea2c05668b7f9d4c47d1245714591aa103831
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          def git(*args,**kwargs):
              return subprocess.check_output(['git',*args],**kwargs)
          def store(sha,obj):
              if 'text' in obj: raw=obj['text'].encode()
              else:
                  lines=git('cat-file','blob',obj['base']).decode().splitlines(keepends=True)
                  for a,b,text in sorted(obj['edits'],key=lambda x:x[0],reverse=True): lines[a:b]=[text]
                  raw=''.join(lines).encode()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha,sha
              assert git('hash-object','-w','--stdin',input=raw).decode().strip()==sha
          # Recover only complete, hash-verified objects from the interrupted transfer.
          old=''.join(pathlib.Path(f'_final_sprint/part-{i:02}.b64').read_text().strip() for i in range(4))
          partial=lzma.LZMADecompressor().decompress(base64.b64decode(old)).decode(errors='ignore')
          decoder=json.JSONDecoder(); pos=1; recovered={}
          while True:
              key,pos=decoder.raw_decode(partial,pos);pos+=1
              if key=='blobs':break
              value,pos=decoder.raw_decode(partial,pos)
              if partial[pos:pos+1]==',':pos+=1
          pos+=1
          while pos<len(partial):
              try:
                  sha,end=decoder.raw_decode(partial,pos)
                  obj,end=decoder.raw_decode(partial,end+1)
              except json.JSONDecodeError:break
              recovered[sha]=obj;pos=end
              if partial[pos:pos+1]==',':pos+=1
              elif partial[pos:pos+1]=='}':break
          assert len(recovered)==39,len(recovered)
          for sha,obj in recovered.items():store(sha,obj)
          encoded=''.join(pathlib.Path(f'_sprint_resume/part-{i:02}.b64').read_text().strip() for i in range(5))
          assert len(encoded)==72048,len(encoded)
          raw=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='ceb5232d4996ff2afd5cffd4310677243b03804fa19f13515b0bcc4b9d3e3c73'
          candidate=json.loads(raw)
          assert candidate['baseline']=='9e5ea2c05668b7f9d4c47d1245714591aa103831'
          assert len(candidate['entries'])==212
          for sha,obj in candidate['blobs'].items():store(sha,obj)
          env=dict(os.environ,GIT_INDEX_FILE='/tmp/proinspect-final-candidate-index')
          subprocess.run(['git','read-tree',candidate['baseline']],env=env,check=True)
          for e in candidate['entries']:
              path=e['path']; assert not path.startswith(('.git/','.github/workflows/','/')) and '..' not in pathlib.PurePosixPath(path).parts
              subprocess.run(['git','update-index','--add','--cacheinfo',e['mode'],e['sha'],path],env=env,check=True)
          tree=git('write-tree',env=env).decode().strip()
          assert tree=='ce536c5bc66ca3e98275e8a9819e0334ed102e71',tree
          pathlib.Path('/tmp/final-sprint-tree').write_text(tree)
          # Keep workflow files unchanged in the bot transport commit. The reviewed clean
          # tree above will subsequently be committed through the connected GitHub action.
          for line in git('ls-tree','-r','HEAD','.github/workflows').decode().splitlines():
              meta,path=line.split('\t');mode,kind,sha=meta.split()
              subprocess.run(['git','update-index','--add','--cacheinfo',mode,sha,path],env=env,check=True)
          transport_tree=git('write-tree',env=env).decode().strip()
          pathlib.Path('/tmp/final-sprint-transport-tree').write_text(transport_tree)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat: recover and reconcile final platform sprint source (activation gated)' | git commit-tree "$(cat /tmp/final-sprint-transport-tree)" -p "$GITHUB_SHA")
          test "$(git ls-remote origin refs/heads/integration/final-platform-release-20261026 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$commit:refs/heads/integration/final-platform-release-20261026"
          mkdir -p artifacts
          printf '%s\n' "$commit" > artifacts/assembled-commit.txt
          cp /tmp/final-sprint-tree artifacts/clean-tree.txt
          git diff --stat 9e5ea2c05668b7f9d4c47d1245714591aa103831 "$(cat /tmp/final-sprint-tree)" > artifacts/recovered-diff-stat.txt
          git archive --format=tar.gz -o artifacts/final-sprint-source.tar.gz "$(cat /tmp/final-sprint-tree)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumed-final-sprint-source
          path: artifacts/
          retention-days: 7
