name: Import checked connected workflow source
on:
  push:
    branches: [feat/connected-portal-workflows]
    paths: ['.source-transfer/ready.json']
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/feat/connected-portal-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connected-portal-workflows
      - name: Validate exact source before writing
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          python3 .source-transfer/apply-checked.py
      - name: Commit expanded source to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md package.json apps/platform database docs integrations packages tests
          git rm -r -- .source-transfer
          git diff --cached --stat
          git commit -m 'feat: connect portfolio strata tenancy documents approvals payments and integration workflows'
          git push origin HEAD:refs/heads/feat/connected-portal-workflows
