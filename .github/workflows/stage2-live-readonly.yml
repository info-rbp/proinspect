name: ProInspect Stage 2 live read-only smoke
on:
  push:
    branches: [audit/stage2-live-readonly-20261015]
  pull_request:
    paths:
      - .github/workflows/stage2-live-readonly.yml
      - scripts/portal-testing/stage2-live-readonly.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage2-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    if: github.repository == 'info-rbp/proinspect' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '8ca23ac6d2cc906d4dd13b8da5ea2b25' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run live Worker and bound production D1 checks (read-only)
        run: node scripts/portal-testing/stage2-live-readonly.mjs
      - name: Upload observed status and unresolved acceptance blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-live-readonly
          path: artifacts/stage2-live-readonly.json
          if-no-files-found: warn
          retention-days: 14
