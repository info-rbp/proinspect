name: Final sprint source and test preparation
on:
  push:
    branches: [integration/final-platform-release-20261026]
    paths: [.github/workflows/final-sprint-source-20261026.yml]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact sources and read-only review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p artifacts/runtime
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create artifacts/repository.bundle --all
          gh api --paginate 'repos/info-rbp/proinspect/pulls?state=open&per_page=100' --jq '.[] | {number,title,state,draft,head: .head.ref,head_sha: .head.sha,base: .base.ref,body,url: .html_url}' > artifacts/pull-requests.jsonl
          git rev-parse origin/main > artifacts/main-sha.txt
          git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin > artifacts/branches.txt
          python3 - <<'PY'
          import json, subprocess
          result=[]
          for line in open('artifacts/pull-requests.jsonl'):
              pr=json.loads(line)
              raw=subprocess.check_output(['gh','api',f"repos/info-rbp/proinspect/actions/runs?head_sha={pr['head_sha']}&per_page=5"])
              runs=json.loads(raw).get('workflow_runs',[])
              result.append({'pr':pr['number'],'head':pr['head_sha'],'runs':[{k:r.get(k) for k in ['id','name','event','status','conclusion','head_sha','html_url']} for r in runs]})
          open('artifacts/checks.json','w').write(json.dumps(result,indent=2))
          PY
      - name: Install exact locked dependencies without provider credentials
        run: pnpm install --frozen-lockfile
      - name: Package relocatable development runtime without secrets
        run: |
          set -eu
          cp "$(command -v node)" artifacts/runtime/node
          pnpm_root="$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")"
          cp -a "$pnpm_root" artifacts/runtime/pnpm
          dirs=(node_modules)
          for d in apps/marketing/node_modules apps/platform/node_modules; do
            if [ -d "$d" ]; then dirs+=("$d"); fi
          done
          tar -czf artifacts/dependencies.tar.gz "${dirs[@]}"
          du -h artifacts/dependencies.tar.gz artifacts/repository.bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-sprint-source-runtime
          path: artifacts/
          retention-days: 3
          compression-level: 1
