name: PCR completion isolated staging
on:
  push:
    branches: [ops/sprint-recovery-20261027]
    paths: [.github/workflows/pcr-completion-staging.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: proinspect-staging-release
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 770d24c67d533d5fa7ada2dd755594da44c561d3
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      CLOUDFLARE_ENV: ''
      WORKERS_CI: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the reviewed staging-only helper and adapt migration counts
        run: |
          test "$(git hash-object ops/final-sprint-staging.mjs)" = 73127f6582081ae44344aa06045d73d5cb47b043
          python3 - <<'PY'
          from pathlib import Path
          text=Path('ops/final-sprint-staging.mjs').read_text()
          for a,b in [('assert.equal(files.length,44)','assert.equal(files.length,46)'),('[19,44].includes','[44,46].includes'),('All 44 migrations applied','All 46 migrations applied')]:
              assert text.count(a)==1,a
              text=text.replace(a,b)
          Path('/tmp/pcr-staging.mjs').write_text(text)
          PY
      - uses: actions/checkout@v4
        with:
          ref: 770d24c67d533d5fa7ada2dd755594da44c561d3
          fetch-depth: 0
          persist-credentials: false
      - name: Require source identity, immutable history and successful full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = ef277dcb0df0f90e4ab82672787ba9bb38e97a01
          for f in $(git ls-tree -r --name-only 1fb09ce3d9af4b13e6fd248654a352cb55bdab17 -- database/migrations); do
            test "$(git rev-parse 1fb09ce3d9af4b13e6fd248654a352cb55bdab17:$f)" = "$(git hash-object "$f")"
          done
          for attempt in $(seq 1 60); do
            result=$(gh api repos/info-rbp/proinspect/actions/runs/40447492868 --jq '[.head_sha,.status,(.conclusion // "pending")] | @tsv')
            test "$(printf '%s' "$result" | cut -f1)" = "$SOURCE_SHA"
            if [ "$(printf '%s' "$result" | cut -f2)" = completed ]; then
              test "$(printf '%s' "$result" | cut -f3)" = success
              exit 0
            fi
            sleep 15
          done
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build without provider or deployment credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler --version
          node /tmp/pcr-staging.mjs prepare
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const p='apps/platform/wrangler.jsonc',c=JSON.parse(readFileSync(p,'utf8'));
          assert.equal(c.name,'proinspect-v3-staging');assert.equal(c.vars.APP_ENV,'staging');
          c.vars.STRIPE_ACCOUNT_ID='acct_1USumhEv62nbUZok';
          c.vars.STRIPE_BILLING_PORTAL_CONFIGURATION_ID='bpc_1UUzPZEv62nbUZokIB3IDWfq';
          assert.equal(c.vars.PCR_LAUNCH_ENABLED,'false');
          assert.equal(c.vars.PCR_DISCOUNT_REDEMPTION_ENABLED,'false');
          assert.equal(c.vars.PCR_SAMPLE_PUBLICATION_ENABLED,'false');
          writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          JS
          pnpm --dir apps/platform build
          pnpm --dir apps/platform exec wrangler deploy --dry-run
          pnpm exec playwright install --with-deps chromium
      - name: Verify isolated identity and retain recovery bookmark before additive migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node /tmp/pcr-staging.mjs before
      - name: Apply only the reviewed staging migration sequence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.final-staging-migration.json
          node /tmp/pcr-staging.mjs after-schema
      - name: Deploy the accepted source only to isolated staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir apps/platform exec wrangler deploy --keep-vars
          node /tmp/pcr-staging.mjs after-deploy
      - name: Inspect responsive draft campaign and public routes with all activation blocked
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '@playwright/test';
          import {writeFileSync} from 'node:fs';
          const origin='https://proinspect-v3-staging.delicate-dream-e4c9.workers.dev',browser=await chromium.launch(),checks=[];
          try {for(const width of [320,390,1100,1440]){
            const page=await browser.newPage({viewport:{width,height:950}});
            for(const path of ['/','/services','/guest/book','/offers/pcr-100','/signin']){
              const r=await page.goto(origin+path,{waitUntil:'networkidle'});
              assert.ok(r&&r.status()===200,path);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false,`${width} ${path}`);
              if(path==='/offers/pcr-100'){
                assert.match(await page.locator('body').innerText(),/draft|review/i);
                assert.match(await page.locator('meta[name="robots"]').getAttribute('content'),/noindex/);
                await page.screenshot({path:`artifacts/pcr-staging-${width}.png`,fullPage:true});
              }
              checks.push({width,path,status:r.status()});
            }
            await page.close();
          }}finally{await browser.close();}
          const sample=await fetch(origin+'/offers/pcr/sample');
          assert.equal(sample.status,404);
          assert.match(await sample.text(),/No approved sample/);
          writeFileSync('artifacts/pcr-staging-browser.json',JSON.stringify({source:process.env.SOURCE_SHA,checks,sampleDenied:true,authenticatedAcceptance:false,providerAcceptance:false},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcr-completion-staging-evidence
          path: artifacts/
          retention-days: 30
