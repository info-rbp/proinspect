name: Activate all-inclusive subscriptions (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/activate-subscriptions-0006.yml
permissions:
  contents: read
concurrency:
  group: proinspect-d1-subscriptions-0006
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'info-rbp/proinspect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Wrangler version
        run: pnpm install --frozen-lockfile
      - name: Enforce approved application baseline
        run: git merge-base --is-ancestor b49b41f4c500b461ddab6f6ef830fa896c663454 HEAD
      - name: Verify exact production database and test-only scope
        run: node scripts/operations/verify-subscription-migration-0006.mjs before
      - name: Create isolated migration-only Wrangler config (not a Worker deployment)
        run: |
          cat > wrangler.subscription-migration.jsonc <<'CONFIG'
          {
            "name": "proinspect-subscription-migration-only",
            "compatibility_date": "2026-07-01",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "proinspect-platform-data",
              "database_id": "dd4f4bc7-cd24-433a-a9ee-d1ffbcc229ea",
              "migrations_dir": "database/migrations"
            }]
          }
          CONFIG
      - name: Confirm only the intended D1 migration is pending
        run: pnpm exec wrangler d1 migrations list DB --remote --config wrangler.subscription-migration.jsonc
      - name: Apply the registered migration through Wrangler with D1 backup
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.subscription-migration.jsonc
      - name: Verify automatic subscription triggers and four test accounts
        run: node scripts/operations/verify-subscription-migration-0006.mjs after
      - name: Retain read-only pre/post verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-subscription-migration-0006
          path: artifacts/subscriptions-*.json
          if-no-files-found: warn
          retention-days: 21
