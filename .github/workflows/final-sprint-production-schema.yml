name: Final sprint guarded production schema
on:
  push:
    branches: [ops/final-sprint-validation-20261026]
    paths: [.github/workflows/final-sprint-production-schema.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: proinspect-production-release
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 0e992ae3a8127f0945e8a10295c0a11bf617a5a4
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp ops/final-sprint-production.mjs /tmp/final-sprint-production.mjs
      - uses: actions/checkout@v4
        with:
          ref: 0e992ae3a8127f0945e8a10295c0a11bf617a5a4
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact-source CI and successful staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for pair in '40350486042 0e992ae3a8127f0945e8a10295c0a11bf617a5a4' '40350617554 fc00276d836477633a56ca11de11f0e7b404763c'; do
            set -- $pair
            ready=false
            for attempt in $(seq 1 80); do
              result=$(gh api "repos/info-rbp/proinspect/actions/runs/$1" --jq '[.head_sha,.status,(.conclusion // "pending")] | @tsv')
              test "$(printf '%s' "$result" | cut -f1)" = "$2"
              status=$(printf '%s' "$result" | cut -f2)
              conclusion=$(printf '%s' "$result" | cut -f3)
              if [ "$status" = completed ]; then test "$conclusion" = success; ready=true; break; fi
              sleep 15
            done
            test "$ready" = true
          done
      - name: Install locked dependencies without production credentials
        run: pnpm install --frozen-lockfile
      - name: Check immutable history and prepare explicit production database target
        run: node /tmp/final-sprint-production.mjs prepare
      - name: Verify production identity, staging source and recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node /tmp/final-sprint-production.mjs before
      - name: Apply additive migrations and verify integrity and retained counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.final-production-migration.json
          node /tmp/final-sprint-production.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-sprint-production-schema-evidence
          path: artifacts/
          retention-days: 30
