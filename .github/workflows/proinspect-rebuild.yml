name: ProInspect Rebuild hosted deployment
on:
  push:
    branches: [proinspect-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proinspect-rebuild-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/proinspect-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKERS_CI: '0'
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Check source and staging authentication
        run: |
          pnpm typecheck
          node tests/runtime/staging-signin.mjs
      - name: Build and validate dedicated rebuild Worker
        run: node scripts/deploy/rebuild.mjs build
      - name: Dry-run with verified staging-only bindings
        run: node scripts/deploy/rebuild.mjs dry-run
      - name: Deploy rebuild branch to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/deploy/rebuild.mjs deploy
      - name: Require Access protection for anonymous requests
        run: |
          status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' https://proinspect-rebuild.delicate-dream-e4c9.workers.dev/)
          case "$status" in 302|303|401|403) echo "Anonymous access restricted ($status)";; *) echo "Unexpected anonymous response ($status)"; exit 1;; esac
