name: ProInspect Rebuild hosted deployment
on:
  push:
    branches: [proinspect-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proinspect-rebuild-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/proinspect-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKERS_CI: '0'
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Check source and staging authentication
        run: |
          pnpm typecheck
          node --experimental-strip-types --test tests/rebuild-navigation.test.ts tests/client-portal-foundation.test.ts tests/unified-site.test.ts
          node tests/runtime/staging-signin.mjs
      - name: Build and validate dedicated rebuild Worker
        run: node scripts/deploy/rebuild.mjs build
      - name: Dry-run with verified staging-only bindings
        run: node scripts/deploy/rebuild.mjs dry-run
      - name: Deploy rebuild branch to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/deploy/rebuild.mjs deploy
      - name: Verify public website, portal entry and protected test authentication
        shell: bash
        run: |
          set -euo pipefail
          origin=https://proinspect-rebuild.delicate-dream-e4c9.workers.dev
          for path in / /services /residential /commercial /co-spaces /maintenance /modular /tenants /leasing /subscriptions /information /client /signin /signup; do
            code=$(curl --silent --show-error --retry 3 --max-time 30 -D /tmp/rebuild-headers -o /tmp/rebuild-page -w '%{http_code}' "$origin$path")
            test "$code" = 200
            grep -qi 'ProInspect' /tmp/rebuild-page
            grep -qi '^x-robots-tag:.*noindex' /tmp/rebuild-headers
            echo "Public $path: $code"
          done
          curl --fail --silent --show-error --retry 3 --max-time 30 "$origin/api/health" > /tmp/rebuild-health.json
          node -e 'const h=require("/tmp/rebuild-health.json"); if(!h.ok||h.environment!=="staging"||h.source!==process.env.GITHUB_SHA||!h.authenticationConfigured||!Object.values(h.bindings).every(Boolean))throw Error("Unexpected rebuild health"); console.log("Deployed source and bindings verified")'
          code=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$origin/auth/staging")
          case "$code" in 302|303|401|403) echo "Tester authentication protected ($code)";; *) echo "Unexpected auth response ($code)"; exit 1;; esac
          code=$(curl --silent --show-error --max-time 30 -D /tmp/rebuild-private -o /dev/null -w '%{http_code}' "$origin/workspaces")
          case "$code" in 302|303|307|308) grep -qi '^location:.*signin' /tmp/rebuild-private;; 401|403) ;; *) echo "Unexpected anonymous portal response ($code)"; exit 1;; esac
          echo "Anonymous workspace access denied"
      - name: Install Chromium for header acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify desktop and mobile navigation in a real browser
        run: node scripts/release/rebuild-navigation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-navigation-evidence
          path: artifacts/rebuild-navigation/
          retention-days: 7
