name: Live release verification 2026-10-22
on:
  push:
    branches: [ops/release-cutover-20261022]
    paths: [.github/workflows/release-live-20261022.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/ops/release-cutover-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eea7584fc612d3b4d872434165008d0d77dc9b74
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked browser dependencies without production credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Require deployed exact merged commit
        run: |
          node --input-type=module <<'JS'
          const expected='eea7584fc612d3b4d872434165008d0d77dc9b74';
          for(let n=0;n<40;n++) {
            try {
              const r=await fetch('https://proinspect.systems/api/health',{signal:AbortSignal.timeout(10000),headers:{'Cache-Control':'no-cache'}});
              if(r.ok&&(await r.json()).source===expected){console.log('Exact merged source is serving production.');process.exit(0);}
            } catch {}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw new Error('Merged source is not confirmed in production');
          JS
      - name: Read-only live domain, database, catalogue and portal denial checks
        env:
          PROINSPECT_ORIGIN: https://proinspect.systems
          CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/portal-testing/stage2-live-readonly.mjs
      - name: Verify real public header and private-page indexing without account mutation
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const origin='https://proinspect.systems';
          mkdirSync('artifacts/live-release',{recursive:true});
          const observations=[];
          const legacy=await fetch('https://proinspect-platform.delicate-dream-e4c9.workers.dev/signin?next=%2Fworkspaces',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          assert.equal(legacy.status,308);
          assert.equal(legacy.headers.get('location'),origin+'/signin?next=%2Fworkspaces');
          const health=await fetch('https://proinspect-platform.delicate-dream-e4c9.workers.dev/api/health',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          assert.equal(health.status,200,'API routes must not redirect');
          observations.push({check:'legacy_navigation_redirect_and_api_compatibility',passed:true});
          const browser=await chromium.launch({headless:true});
          try {
            for(const width of [320,390,1100,1440]) {
              const page=await browser.newPage({viewport:{width,height:950}});
              const response=await page.goto(origin+'/guest/book/routine-inspection',{waitUntil:'networkidle'});
              assert.equal(response.status(),200);
              assert.match(response.headers()['x-robots-tag']||'',/noindex/);
              assert.ok(await page.locator('body').evaluate(el=>el.classList.contains('site')));
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              const header=page.locator('.mkt-site-header');
              assert.ok(await header.getByRole('link',{name:'Book a service'}).isVisible());
              assert.ok(await page.getByText('Online one-off bookings are not yet available',{exact:true}).isVisible(),'Do not falsely present disabled intake as active');
              if(width>1100) {
                const audience=header.locator('.mkt-nav-dropdown summary');
                const services=header.getByRole('navigation',{name:'Primary navigation'}).getByRole('link',{name:'Services',exact:true});
                const a=await audience.boundingBox(),s=await services.boundingBox();
                assert.ok(Math.abs((a.y+a.height/2)-(s.y+s.height/2))<3);
                await audience.click();assert.equal(await header.locator('.mkt-nav-dropdown').getAttribute('open'),'');
                await page.keyboard.press('Escape');assert.equal(await header.locator('.mkt-nav-dropdown').getAttribute('open'),null);
              }
              await page.screenshot({path:'artifacts/live-release/guest-page-'+width+'.png'});
              await header.screenshot({path:'artifacts/live-release/header-'+width+'.png'});
              observations.push({check:'live_guest_header_'+width,passed:true});
              await page.close();
            }
            const page=await browser.newPage();
            const signin=await page.goto(origin+'/signin',{waitUntil:'domcontentloaded'});
            assert.equal(signin.status(),200);
            const html=await page.content();
            observations.push({check:'signin_renders',passed:true,publicTurnstileSiteKeys:[...new Set(html.match(/0x4AAAAA[A-Za-z0-9_-]+/g)||[])]});
            await page.close();
            writeFileSync('artifacts/live-release/public-checks.json',JSON.stringify({time:new Date().toISOString(),source:'eea7584fc612d3b4d872434165008d0d77dc9b74',observations,realAuthenticatedJourneys:'not_executed',providerAcceptance:'not_executed'},null,2));
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-release-verification-20261022
          path: artifacts/
          retention-days: 30
