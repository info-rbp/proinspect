name: V3 production D1 upgrade (migration only)
on:
  push:
    branches: [version-3-enhancements]
    paths: [.github/workflows/v3-production-d1-migrate.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proinspect-production-d1-release
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/version-3-enhancements'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '8ca23ac6d2cc906d4dd13b8da5ea2b25' }}
      V3_PRODUCTION_MIGRATION: explicit-user-approved-2026-10-21
      CLOUDFLARE_ENV: ''
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse changed application code, changed main or incorrect target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/version-3-enhancements'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          prior='0f66f61b5fd1439dbeb46983c5a387ca79f3d872'
          test "$(git diff --name-only "$prior" HEAD)" = "$(printf '%s\n' '.github/workflows/v3-production-d1-migrate.yml' 'scripts/release/v3-production-d1-state.mjs')"
          baseline='e819659dba660e85b88a013257806e6462f4c38e'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$baseline"
          git diff --exit-code "$baseline" HEAD -- 'database/migrations/000[1-6]_*.sql'
          test "$(find database/migrations -type f -name '*.sql' | wc -l | tr -d ' ')" = '19'
          node --check scripts/release/v3-production-d1-state.mjs
          node --check scripts/release/v3-production-recovery-readonly.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$CLOUDFLARE_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify code, D1 schema replay and protected Worker integrations
        run: |
          pnpm check
          pnpm test:integration
          python3 scripts/release/v3-upgrade-rehearsal.py
      - name: Capture fresh production recovery bookmark and pre-upgrade baseline
        run: |
          set -euo pipefail
          node scripts/release/v3-production-recovery-readonly.mjs
          node scripts/release/v3-production-d1-state.mjs before
      - name: Create migration-only configuration for the exact production D1 UUID
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const config={
            name:'v3-production-d1-migration-only',
            compatibility_date:'2026-07-01',
            d1_databases:[{
              binding:'DB',
              database_name:'proinspect-platform-data',
              database_id:'dd4f4bc7-cd24-433a-a9ee-d1ffbcc229ea',
              migrations_dir:'database/migrations'
            }]
          };
          writeFileSync('wrangler.v3-production-d1-migration.json',
            JSON.stringify(config,null,2)+'\n',{mode:0o600});
          NODE
      - name: Preview outstanding production D1 migration plan
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations list DB --remote --config wrangler.v3-production-d1-migration.json
      - name: Recheck main and apply numbered migrations to production D1 only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'e819659dba660e85b88a013257806e6462f4c38e'
          pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.v3-production-d1-migration.json
      - name: Verify production migration ledger and preservation of existing core record counts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/v3-production-d1-state.mjs after
      - name: Preserve protected recovery and migration evidence for authorised operators
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-production-d1-migration-evidence
          path: |
            artifacts/v3-production-recovery-readonly.json
            artifacts/v3-production-d1-before.json
            artifacts/v3-production-d1-after.json
            artifacts/v3-upgrade-rehearsal.json
          if-no-files-found: warn
          retention-days: 7
