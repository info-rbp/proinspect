name: Repair Perth test fixture
on:
  push:
    branches: [fix/sprint-completion-hardening-20261027]
    paths: [.github/workflows/repair-perth-fixture.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed calendar-only regression
        run: |
          set -euo pipefail
          test "$(git diff --name-only cc22c25f9f57211247146554a42fdb479fd9f3a0 HEAD)" = .github/workflows/repair-perth-fixture.yml
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          payload=''
          patch=gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='41b0c3941fbb9eb8100d8a7405ca6fb5b130d9ee1be6f1fbcb2e3c0550a2c669'
          Path('/tmp/calendar.patch').write_bytes(patch)
          PY
          git apply --check /tmp/calendar.patch
          git apply /tmp/calendar.patch
          git add tests
          git rm .github/workflows/repair-perth-fixture.yml
          test "$(git write-tree)" = 96f6172bdaf6455bff37f56b083d9c69f12bb1bb
          git restore --source=HEAD --staged --worktree .github/workflows/repair-perth-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: choose future roster fixtures in one Perth calendar consistently'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
