name: Website Improvement Guide visual acceptance
on:
  pull_request:
    paths:
      - 'apps/marketing/**'
      - 'apps/platform/app/**'
      - 'packages/marketing/**'
      - 'packages/ui/**'
      - 'tests/browser/**'
      - '.github/workflows/website-guide-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-guide-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision disposable local fixture
        run: |
          mkdir -p artifacts
          pnpm local:init --test-fixtures
          pnpm exec playwright install --with-deps chromium
      - name: Capture responsive guide evidence and test affected routes
        run: pnpm exec playwright test tests/browser/website-improvement-guide.spec.ts tests/browser/marketing-redesign.spec.ts tests/browser/co-living-marketing.spec.ts
      - name: Archive screenshot and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-guide-pr124-review
          path: |
            artifacts/guide-*.png
            artifacts/browser-results.json
            playwright-report/
            test-results/
          retention-days: 7
