name: V3 production Worker binding inventory (read-only)
on:
  push:
    branches: [version-3-enhancements]
    paths: [.github/workflows/v3-production-worker-binding-audit.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/version-3-enhancements'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '8ca23ac6d2cc906d4dd13b8da5ea2b25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing production bindings only (no writes)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,mkdirSync} from 'node:fs';
          const id=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/.test(id??'')||!token)throw new Error('Missing scoped Cloudflare access');
          const worker='proinspect-platform';
          const url='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/'+worker+'/settings';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(25000)});
          const value=await response.json();
          if(!response.ok||value.success!==true)throw new Error('Cloudflare GET Worker settings HTTP '+response.status);
          const settings=value.result??{};
          const bindings=(settings.bindings??[]).map(b=>({
            name:b.name,type:b.type,
            bucket_name:b.type==='r2_bucket'?b.bucket_name:undefined,
            database_id:b.type==='d1'?b.id:undefined,
            queue:b.type==='queue'?b.queue_name:undefined,
            class_name:b.type==='durable_object_namespace'?b.class_name:undefined,
          }));
          const expected=['DB','DOCUMENTS','RESTRICTED_DOCUMENTS','SCHEDULER','EVENTS'];
          for(const name of expected)if(!bindings.some(b=>b.name===name))
            throw new Error('Missing production Worker binding '+name);
          const db=bindings.find(b=>b.name==='DB');
          if(db.database_id!=='dd4f4bc7-cd24-433a-a9ee-d1ffbcc229ea')
            throw new Error('Bound live D1 UUID mismatch');
          const result={status:'PASS',worker,bindings,
            varsIncludeSecretValues:false,productionWrites:false,readAt:new Date().toISOString()};
          mkdirSync('artifacts',{recursive:true});
          writeFileSync('artifacts/v3-production-worker-bindings.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-production-worker-bindings-readonly
          path: artifacts/v3-production-worker-bindings.json
          if-no-files-found: warn
          retention-days: 3
