name: Assemble portal acceptance execution
on:
  push:
    branches: [feature/hosted-portal-acceptance-20261025]
    paths:
      - '.github/workflows/acceptance-bootstrap-20261025.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/feature/hosted-portal-acceptance-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify origin and reconstruct verified source patch
        shell: bash
        run: |
          git merge-base --is-ancestor a72f0382eac6cda2a44f33bcc5a604c979e38a3b HEAD
          cat .github/acceptance-bootstrap/chunk-0{0..6} > /tmp/proinspect-acceptance.b64
          base64 -d /tmp/proinspect-acceptance.b64 | xz -d > /tmp/proinspect-acceptance.patch
          echo "51284fd5016579081f822cf9ae8b7fbcaf2aa3f705881b76f98473bfc7e964e0  /tmp/proinspect-acceptance.patch" | sha256sum -c -
          git apply --check /tmp/proinspect-acceptance.patch
          git apply /tmp/proinspect-acceptance.patch
          rm -r .github/acceptance-bootstrap .github/workflows/acceptance-bootstrap-20261025.yml
          git add -A
          test "$(git write-tree)" = "8e45ebedd19d8893499b94a4cfa956a16972b71c"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: add hosted authentication, AT01-AT12 evidence, and protected launch review'
          git push origin HEAD:feature/hosted-portal-acceptance-20261025
