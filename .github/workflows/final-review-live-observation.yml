name: Final sprint read-only production review
on:
  push:
    branches: [ops/sprint-recovery-20261027]
    paths: [.github/workflows/final-review-live-observation.yml]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: b633b75ce2a75b84848c780eba0a82d559755518
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b633b75ce2a75b84848c780eba0a82d559755518
          persist-credentials: false
      - name: Verify exact merged source and successful post-merge CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = ef277dcb0df0f90e4ab82672787ba9bb38e97a01
          for attempt in $(seq 1 60); do
            result=$(gh api repos/info-rbp/proinspect/actions/runs/40448615320 --jq '[.head_sha,.status,(.conclusion // "pending")] | @tsv')
            test "$(printf '%s' "$result" | cut -f1)" = "$SOURCE_SHA"
            if [ "$(printf '%s' "$result" | cut -f2)" = completed ]; then
              test "$(printf '%s' "$result" | cut -f3)" = success
              exit 0
            fi
            sleep 10
          done
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use an available browser or bounded isolated install without credentials
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 180 pnpm install --frozen-lockfile
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'PROINSPECT_REVIEW_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            timeout 120 pnpm exec playwright install --only-shell chromium
          fi
          mkdir -p artifacts
      - name: Observe deployment identity, flags and database integrity without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync,readdirSync} from 'node:fs';
          const account='8ca23ac6d2cc906d4dd13b8da5ea2b25',source=process.env.SOURCE_SHA;
          async function cf(path,sql){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{method:sql?'POST':'GET',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:sql?JSON.stringify({sql}):undefined,signal:AbortSignal.timeout(30000)});
            const j=await r.json();assert.ok(r.ok&&j.success,`Read-only observation failed: ${r.status}`);return j.result;
          }
          const ledger=readdirSync('database/migrations').filter(n=>n.endsWith('.sql')).sort();assert.equal(ledger.length,46);
          const observations=[];
          for(const [worker,db,expected] of [['proinspect-platform','dd4f4bc7-cd24-433a-a9ee-d1ffbcc229ea',source],['proinspect-v3-staging','e66b8ebc-637d-4737-8d47-b0fbec3c082c','770d24c67d533d5fa7ada2dd755594da44c561d3']]){
            const settings=await cf(`/workers/scripts/${worker}/settings`),b=settings.bindings||[],vars=Object.fromEntries(b.filter(x=>x.type==='plain_text').map(x=>[x.name,x.text]));
            assert.equal(vars.BUILD_SHA,expected);assert.equal(b.find(x=>x.name==='DB')?.id,db);
            assert.ok(Object.entries(vars).filter(([k])=>/_ENABLED$|_APPROVED$|_READY$/.test(k)&&k!=='GOOGLE_CALENDAR_ENABLED').every(([,v])=>v==='false'));
            for(const flag of ['PCR_LAUNCH_ENABLED','PCR_DISCOUNT_REDEMPTION_ENABLED','PCR_SAMPLE_PUBLICATION_ENABLED'])assert.equal(vars[flag],'false');
            const result=await cf(`/d1/database/${db}/query`,"SELECT name FROM d1_migrations ORDER BY name; PRAGMA foreign_key_check; SELECT count(*) AS activeServices,sum(price_ex_gst_cents IS NOT NULL) AS pricedServices FROM services WHERE active=1;");
            assert.ok(result.every(x=>x.success));assert.deepEqual(result[0].results.map(x=>x.name),ledger);assert.deepEqual(result[1].results,[]);
            observations.push({worker,source:vars.BUILD_SHA,migrations:ledger.length,lastMigration:ledger.at(-1),foreignKeyViolations:0,catalogue:result[2].results[0],secretNames:b.filter(x=>x.type==='secret_text').map(x=>x.name).sort(),enabledFlags:Object.entries(vars).filter(([k,v])=>/_ENABLED$/.test(k)&&v==='true').map(([k])=>k),campaignFlagsDisabled:true});
          }
          writeFileSync('artifacts/final-live-infrastructure.json',JSON.stringify({observedAt:new Date().toISOString(),readOnly:true,observations,hostedHumanAcceptance:false,providerTransactionAcceptance:false},null,2));
          JS
      - name: Inspect rendered production pages and anonymous portal denial without submitting authentication
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '@playwright/test';
          import {writeFileSync} from 'node:fs';
          const source=process.env.SOURCE_SHA,origin='https://proinspect.systems',checks=[];
          const savePartial=()=>writeFileSync('artifacts/final-live-browser-progress.json',JSON.stringify({source,checks,complete:false,hostedHumanAcceptance:false,providerTransactionAcceptance:false},null,2));
          const health=await (await fetch(origin+'/api/health',{signal:AbortSignal.timeout(30000)})).json();assert.equal(health.source,source);
          for(const workspace of ['landlord','property-manager','commercial','strata-manager','tenant','building','strata-council','staff','building-manager']){
            const path=`/api/w/${workspace}/not-authorized/overview`,r=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(30000)});assert.ok([401,403,404].includes(r.status),workspace);checks.push({path,status:r.status,anonymousDenied:true});
          }
          savePartial();
          const browser=await chromium.launch(process.env.PROINSPECT_REVIEW_BROWSER_CHANNEL?{channel:process.env.PROINSPECT_REVIEW_BROWSER_CHANNEL}:{}),browserVersion=browser.version();
          try {for(const width of [320,390,1100,1440]){
            const page=await browser.newPage({viewport:{width,height:950}});
            page.setDefaultTimeout(15000);
            for(const path of ['/','/services','/guest/book','/offers/pcr-100','/signin']){
              // Turnstile may keep connections open. Verify rendered application controls, not network silence.
              const r=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});assert.equal(r?.status(),200,path);
              await page.locator('main').first().waitFor({state:'visible'});
              await page.getByRole('heading',{level:1}).first().waitFor({state:'visible'});
              if(path==='/signin'){
                await page.getByLabel('Email address',{exact:true}).waitFor({state:'visible'});
                await page.getByRole('button',{name:'Email sign-in link',exact:true}).waitFor({state:'visible'});
                await page.locator('[aria-label="Security verification"]').waitFor({state:'attached'});
                await page.locator('input[name="turnstile"][type="hidden"]').waitFor({state:'attached'});
                await page.locator('script[data-proinspect-turnstile]').waitFor({state:'attached'});
                // Do not read a token, request email, solve CAPTCHA, manufacture a session or claim login acceptance.
              }
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false,`${width} ${path}`);
              if(path==='/offers/pcr-100'){
                assert.match(await page.locator('body').innerText(),/draft|review/i);assert.match(await page.locator('meta[name="robots"]').getAttribute('content'),/noindex/);
                await page.screenshot({path:`artifacts/final-live-campaign-${width}.png`,fullPage:true});
              }
              checks.push({width,path,status:r.status(),overflow:false,renderedControls:true});savePartial();
            }await page.close();
          }}finally{savePartial();await browser.close();}
          const sample=await fetch(origin+'/offers/pcr/sample',{signal:AbortSignal.timeout(30000)});assert.equal(sample.status,404);assert.match(await sample.text(),/No approved sample/);
          writeFileSync('artifacts/final-live-browser.json',JSON.stringify({source,browserVersion,observedAt:new Date().toISOString(),checks,complete:true,sampleDenied:true,authenticationSubmitted:false,hostedHumanAcceptance:false,providerTransactionAcceptance:false},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-sprint-readonly-live-review
          path: artifacts/
          retention-days: 30
