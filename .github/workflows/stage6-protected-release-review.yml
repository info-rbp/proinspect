name: Stage 6 market launch independent acceptance
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character reviewed production main commit
        required: true
        type: string
      evidence_run_id:
        description: Actions run carrying redacted Stage 6 evidence
        required: true
        type: string
      portal_review_run_id:
        description: Successful independently protected nine-portal review run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: stage6-production-launch-review
  cancel-in-progress: false
jobs:
  decide:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-launch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit independently protected environment
        env:
          APPROVAL_PROTECTION: ${{ vars.PROINSPECT_LAUNCH_REVIEWERS_CONFIGURED }}
        run: |
          if [ "$APPROVAL_PROTECTION" != true ]; then
            echo 'NO GO: Configure independent required reviewers for production-launch and attest the protection variable.'
            exit 1
          fi
      - name: Confirm exact main and deployed production Worker source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module -e '
            const sha=process.env.EXPECTED_SHA;
            if(!/^[a-f0-9]{40}$/.test(sha)||sha!==process.env.GITHUB_SHA)
              throw Error("NO GO: reviewed SHA differs from checked-out main");
            const r=await fetch("https://proinspect.systems/api/health",
              {redirect:"manual",signal:AbortSignal.timeout(15000)});
            if(!r.ok||r.status!==200||r.redirected)throw Error("NO GO: production health unavailable");
            const health=await r.json();
            if(health.source!==sha||health.environment!=="production"||
              Object.values(health.bindings||{}).some(x=>x!==true))
              throw Error("NO GO: exact deployed source or critical bindings mismatch");
          '
      - name: Verify protected nine-portal review completed successfully for this SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PORTAL_REVIEW_RUN: ${{ inputs.portal_review_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            const run=process.env.PORTAL_REVIEW_RUN;
            if(!/^[1-9]\d*$/.test(run))throw Error("NO GO: invalid portal review identifier");
            const resp=await fetch("https://api.github.com/repos/info-rbp/proinspect/actions/runs/"+run,
              {headers:{Authorization:"Bearer "+process.env.GH_TOKEN,
                Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},signal:AbortSignal.timeout(15000)});
            if(!resp.ok)throw Error("NO GO: portal review run cannot be verified");
            const record=await resp.json();
            if(record.conclusion!=="success"||record.head_sha!==process.env.EXPECTED_SHA||
              record.name!=="Nine-portal hosted production acceptance (independent review)"||
              record.event!=="workflow_dispatch")
              throw Error("NO GO: nine-portal evidence did not pass protected exact-source review");
          '
      - name: Download redacted reviewed Stage 6 acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: proinspect-stage6-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/stage6
      - name: Confirm bundle belongs to successful portal review
        env:
          PORTAL_REVIEW_RUN: ${{ inputs.portal_review_run_id }}
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const record=JSON.parse(readFileSync("artifacts/stage6/market-launch-evidence.json","utf8"));
            const actual=record.hostedPortalAcceptance?.protectedReviewRun;
            const expected="https://github.com/info-rbp/proinspect/actions/runs/"+process.env.PORTAL_REVIEW_RUN;
            if(actual!==expected)throw Error("NO GO: portal review evidence is not bound to the verified protected run");
          '
      - name: Reject missing or tampered source-bound independent evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
          PROINSPECT_PROTECTED_LAUNCH_REVIEW: 'true'
        run: |
          node scripts/stage6-market-launch-gate.mjs artifacts/stage6/market-launch-evidence.json "$EXPECTED_SOURCE_SHA"
      - name: Record the reviewed GO or NO GO decision, never activate feature flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proinspect-stage6-market-launch-decision
          path: artifacts/stage6-market-launch-decision.json
          retention-days: 30
          if-no-files-found: warn
