name: Cloudflare deployment locked pending acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-locked:
    runs-on: ubuntu-latest
    steps:
      - name: Repository acceptance required
        run: |
          echo 'Cloudflare deployment is intentionally disabled at the owner request.'
          echo 'No credentials are loaded, resources provisioned, migrations applied remotely or Workers deployed.'
          echo 'Re-enable a reviewed deployment workflow only after explicit repository acceptance.'
