name: PR-01 existing staging preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr01-existing-v3-staging
  cancel-in-progress: false
jobs:
  staging-preview:
    if: github.repository == 'info-rbp/proinspect' && github.event.pull_request.number == 97 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKERS_CI: '0'
      PR01_STAGING_PREVIEW: '1'
      CLOUDFLARE_ENV: ''
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify staging boundaries and record the exact source
        run: |
          node --test tests/staging-preview.test.mjs
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/pr01-staging-source-sha.txt
      - name: Build and validate existing staging resource bindings
        run: node scripts/deploy/staging-preview.mjs build
      - name: Deploy only to the existing shared staging Worker
        run: node scripts/deploy/staging-preview.mjs deploy
      - name: Check hosted public and private boundaries
        run: node scripts/release/v3-staging-smoke.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check hosted navigation, hydration and responsive layout
        run: node scripts/release/v3-staging-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr01-existing-staging-preview
          path: artifacts/
          retention-days: 7
