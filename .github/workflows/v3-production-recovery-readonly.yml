name: V3 production recovery bookmark read-only
on:
  push:
    branches: [version-3-enhancements]
    paths:
      - scripts/release/v3-production-recovery-readonly.mjs
      - .github/workflows/v3-production-recovery-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-production-recovery-readonly
  cancel-in-progress: true
jobs:
  inspect:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/version-3-enhancements'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '8ca23ac6d2cc906d4dd13b8da5ea2b25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check read-only production recovery audit source
        run: node --check scripts/release/v3-production-recovery-readonly.mjs
      - name: Read current production D1 Time Travel bookmark and migration ledger only
        run: node scripts/release/v3-production-recovery-readonly.mjs
      - name: Retain recovery evidence for release administrator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-production-recovery-readonly
          path: artifacts/v3-production-recovery-readonly.json
          if-no-files-found: warn
          retention-days: 7
