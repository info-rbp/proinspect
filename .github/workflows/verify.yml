name: Verify ProInspect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture source and deployment readiness without secret values
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          cp pnpm-lock.yaml artifacts/
          git archive --format=tar.gz -o artifacts/source.tar.gz HEAD
          node -e "const fs=require('fs');const r={cloudflareTokenConfigured:process.env.HAS_CF_TOKEN==='true',cloudflareAccountConfigured:process.env.HAS_CF_ACCOUNT==='true',deployed:false};fs.writeFileSync('artifacts/deployment-readiness.json',JSON.stringify(r,null,2));console.log(JSON.stringify(r));"
      - name: Typecheck, domain tests, SQL invariants and both builds
        run: pnpm check
      - name: Exercise actual Worker, D1, R2 and scheduling APIs
        run: pnpm test:integration
      - name: Wrangler upload dry-run for both applications
        run: |
          pnpm --dir apps/marketing exec wrangler deploy --dry-run
          pnpm --dir apps/platform exec wrangler deploy --dry-run
      - name: Prepare isolated browser test data
        run: |
          pnpm local:init --test-fixtures
          pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance and responsive screenshots
        run: pnpm test:browser
      - name: Capture offline debugging dependencies
        if: failure()
        run: tar -czf artifacts/dependencies.tar.gz node_modules apps/marketing/node_modules apps/platform/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proinspect-verification
          path: |
            artifacts/
            playwright-report/
          retention-days: 7
