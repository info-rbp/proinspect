name: Verify ProInspect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture exact source and repository-only acceptance status
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          cp pnpm-lock.yaml artifacts/
          git archive --format=tar.gz -o artifacts/source.tar.gz HEAD
          printf '{"deploymentLocked":true,"deployed":false}\n' > artifacts/deployment-readiness.json
      - name: Typecheck, domain tests, SQL invariants and both builds
        run: pnpm check
      - name: Exercise actual Worker, D1, R2 and scheduling APIs
        run: pnpm test:integration
      - name: Wrangler upload dry-run for both applications
        run: |
          pnpm --dir apps/marketing exec wrangler deploy --dry-run
          pnpm --dir apps/platform exec wrangler deploy --dry-run
      - name: Rehearse 0054 in a clean local Cloudflare D1 database
        run: pnpm test:pr01-d1
      - name: Verify existing staging preview isolation
        run: node --test tests/staging-preview.test.mjs
      - name: Prepare isolated browser test data
        run: |
          pnpm local:init --test-fixtures
          pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance and responsive screenshots
        run: |
          pnpm test:browser
          node scripts/portal-testing/isolated-scenario-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proinspect-verification
          path: |
            artifacts/
            playwright-report/
          retention-days: 7
  staging-preview:
    if: github.repository == 'info-rbp/proinspect' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/pr01-account-driven-client-portal') || (github.event_name == 'pull_request' && github.event.pull_request.number == 97 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr01-existing-v3-staging
      cancel-in-progress: false
    env:
      WORKERS_CI: '0'
      PR01_STAGING_PREVIEW: '1'
      CLOUDFLARE_ENV: ''
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify staging boundaries and record the exact source
        run: |
          node --test tests/staging-preview.test.mjs
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/pr01-staging-source-sha.txt
      - name: Build and validate existing staging resource bindings
        run: node scripts/deploy/staging-preview.mjs build
      - name: Deploy only to the existing shared staging Worker
        run: node scripts/deploy/staging-preview.mjs deploy
      - name: Check hosted public and private boundaries
        run: node scripts/release/v3-staging-smoke.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check hosted navigation, hydration and responsive layout
        run: node scripts/release/v3-staging-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr01-existing-staging-preview
          path: artifacts/
          retention-days: 7
