name: Verify ProInspect
on:
  push:
    branches: [main, 'integration/report-creation-tool']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture exact source and repository-only acceptance status
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          cp pnpm-lock.yaml artifacts/
          git archive --format=tar.gz -o artifacts/source.tar.gz HEAD
          printf '{"deploymentLocked":true,"deployed":false}\n' > artifacts/deployment-readiness.json
      - name: Typecheck, domain tests, SQL invariants and both builds
        run: pnpm check
      - name: Exercise actual Worker, D1, R2 and scheduling APIs
        run: pnpm test:integration
      - name: Wrangler upload dry-run for both applications
        run: |
          pnpm --dir apps/marketing exec wrangler deploy --dry-run
          pnpm --dir apps/platform exec wrangler deploy --dry-run
      - name: Prepare isolated browser test data
        run: |
          pnpm local:init --test-fixtures
          pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance and responsive screenshots
        run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proinspect-verification
          path: |
            artifacts/
            playwright-report/
          retention-days: 7

  propose-report-engine-update:
    # The Verify workflow already exists on main, so a manual workflow_dispatch
    # selecting this integration branch can execute this branch-only helper job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/report-creation-tool'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/report-creation-tool
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare a reviewed upstream change proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-report-engine.mjs
