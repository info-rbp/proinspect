name: Guarded production migration 2026-10-22
on:
  push:
    branches: [ops/release-cutover-20261022]
    paths: [.github/workflows/release-cutover-20261022.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: proinspect-production-schema-cutover
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'info-rbp/proinspect' && github.ref == 'refs/heads/ops/release-cutover-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63d4e2e09104d606829f82c2c8e9f8280ebea3e4
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without production credentials
        run: pnpm install --frozen-lockfile
      - name: Require successful full CI on exact release head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {mkdirSync, writeFileSync} from 'node:fs';
          const sha='63d4e2e09104d606829f82c2c8e9f8280ebea3e4';
          const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','User-Agent':'proinspect-guarded-release'};
          for(let attempt=0;attempt<40;attempt++) {
            const response=await fetch('https://api.github.com/repos/info-rbp/proinspect/actions/runs?head_sha='+sha+'&event=pull_request&per_page=20',{headers,signal:AbortSignal.timeout(15000)});
            if(!response.ok) throw new Error('Cannot verify exact-source CI');
            const data=await response.json();
            const run=data.workflow_runs?.filter(r=>r.name==='Verify ProInspect'&&r.head_sha===sha).sort((a,b)=>b.id-a.id)[0];
            if(run?.status==='completed') {
              if(run.conclusion!=='success') throw new Error('Full candidate verification did not pass');
              mkdirSync('artifacts/release-cutover',{recursive:true});
              writeFileSync('artifacts/release-cutover/ci.json',JSON.stringify({sha,runId:run.id,conclusion:run.conclusion,url:run.html_url},null,2));
              console.log('Exact-source verification passed:',run.id);
              process.exit(0);
            }
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          throw new Error('Candidate verification is not complete; no production changes authorised by this job');
          JS
      - name: Check production identity and recovery point, then apply only additive migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8ca23ac6d2cc906d4dd13b8da5ea2b25
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,readdirSync,unlinkSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const account='8ca23ac6d2cc906d4dd13b8da5ea2b25';
          const db='dd4f4bc7-cd24-433a-a9ee-d1ffbcc229ea';
          const baseline='5c7034262bc29c99be6144bc09c198c0033838b6';
          const release='63d4e2e09104d606829f82c2c8e9f8280ebea3e4';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),release);
          assert.equal(process.env.CLOUDFLARE_ACCOUNT_ID,account);
          assert.ok(process.env.CLOUDFLARE_API_TOKEN,'Missing production credential');
          const gh=await fetch('https://api.github.com/repos/info-rbp/proinspect/commits/main',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,'User-Agent':'proinspect-guarded-release'},signal:AbortSignal.timeout(15000)});
          assert.ok(gh.ok); assert.equal((await gh.json()).sha,baseline,'Main changed: reconcile before migration');
          const manifest=JSON.parse(readFileSync('.github/release-migration-baseline.json','utf8'));
          assert.equal(manifest.source,baseline);
          for(const [path,hash] of Object.entries(manifest.migrations)) assert.equal(execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(),hash,'Previously applied migration changed');
          const files=readdirSync('database/migrations').filter(x=>x.endsWith('.sql')).sort();
          const original=Object.keys(manifest.migrations).map(p=>p.split('/').at(-1)).sort();
          const additions=['0020_reporting_engine.sql','0021_v2_operating_model.sql','0022_v2_maintenance_delivery.sql','0023_v2_asset_preventive_compliance.sql','0024_v2_sector_packs.sql','0025_v2_capital_enterprise.sql','0026_v2_review_integrity.sql'];
          assert.deepEqual(files,[...original,...additions]);
          async function cf(path,body) {
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(25000)});
            const data=await response.json();
            if(!response.ok||!data.success) throw new Error('Cloudflare request failed: HTTP '+response.status+' codes '+JSON.stringify(data.errors?.map(x=>x.code)));
            return data.result;
          }
          async function query(sql) {const rows=await cf('/d1/database/'+db+'/query',{sql});assert.ok(rows.every(x=>x.success));return rows;}
          const settings=await cf('/workers/scripts/proinspect-platform/settings');
          const binding=name=>settings.bindings.find(b=>b.name===name);
          assert.equal(binding('DB')?.id,db);assert.equal(binding('APP_ENV')?.text,'production');assert.equal(binding('BUILD_SHA')?.text,baseline,'Worker changed before migration');
          assert.equal((await cf('/d1/database/'+db)).name,'proinspect-platform-data');
          const countsSql="SELECT (SELECT COUNT(*) FROM users) users,(SELECT COUNT(*) FROM clients) clients,(SELECT COUNT(*) FROM properties) properties,(SELECT COUNT(*) FROM bookings) bookings,(SELECT COUNT(*) FROM work_orders) work_orders,(SELECT COUNT(*) FROM documents) documents,(SELECT COUNT(*) FROM payments) payments";
          const beforeLedger=(await query('SELECT name FROM d1_migrations ORDER BY name'))[0].results.map(r=>r.name);
          assert.ok(beforeLedger.length===19||beforeLedger.length===26,'Unexpected migration baseline; stop');
          assert.deepEqual(beforeLedger,files.slice(0,beforeLedger.length));
          assert.equal((await query('PRAGMA foreign_key_check'))[0].results.length,0,'Existing foreign-key violation');
          const beforeCounts=(await query(countsSql))[0].results[0];
          const recovery=await cf('/d1/database/'+db+'/time_travel/bookmark');
          assert.ok(typeof recovery.bookmark==='string'&&recovery.bookmark.length>10,'No recovery bookmark; stop');
          const before={time:new Date().toISOString(),release,baseline,database:db,recoveryBookmark:recovery.bookmark,ledger:beforeLedger,counts:beforeCounts};
          writeFileSync('artifacts/release-cutover/before.json',JSON.stringify(before,null,2));
          console.log('Verified production baseline and recovery bookmark; pending:',files.slice(beforeLedger.length));
          if(beforeLedger.length===19) {
            const config='.release-migrations.json';
            writeFileSync(config,JSON.stringify({name:'proinspect-release-migrations',account_id:account,compatibility_date:'2026-10-01',d1_databases:[{binding:'DB',database_name:'proinspect-platform-data',database_id:db,migrations_dir:'database/migrations'}]},null,2));
            try {execFileSync('pnpm',['exec','wrangler','d1','migrations','apply','DB','--remote','--config',config],{stdio:'inherit',env:{...process.env,CI:'true',CLOUDFLARE_ENV:''}});} finally {unlinkSync(config);}
          }
          const afterLedger=(await query('SELECT name FROM d1_migrations ORDER BY name'))[0].results.map(r=>r.name);
          assert.deepEqual(afterLedger,files,'Incomplete migration ledger');
          const fk=(await query('PRAGMA foreign_key_check'))[0].results;assert.equal(fk.length,0);
          const afterCounts=(await query(countsSql))[0].results[0];
          for(const [table,total] of Object.entries(beforeCounts)) assert.ok(afterCounts[table]>=total,'Unexpected loss in '+table);
          writeFileSync('artifacts/release-cutover/after.json',JSON.stringify({time:new Date().toISOString(),release,database:db,ledger:afterLedger,counts:afterCounts,foreignKeyViolations:fk.length,workerDeployed:false},null,2));
          console.log('PASS: all 26 migrations present; foreign-key check clear; existing core counts preserved. No Worker deployment or feature activation performed.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-schema-cutover-20261022
          path: artifacts/release-cutover/
          retention-days: 30
