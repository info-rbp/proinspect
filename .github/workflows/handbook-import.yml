name: Import hash-verified final-sprint continuation
on:
  push:
    branches: [feature/final-sprint-handbook-20261027]
    paths:
      - '.handoff/final-sprint-20261027.patch.gz'
      - '.github/workflows/handbook-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline, apply tested delta, and remove handoff
        shell: bash
        run: |
          set -euo pipefail
          test -f .handoff/final-sprint-20261027.patch.gz
          echo "c5e31d162afd2210e78fcca7c7df2c743a11faca1b195a64fb9067013f4fc7bb  .handoff/final-sprint-20261027.patch.gz" | sha256sum -c -
          gzip -dc .handoff/final-sprint-20261027.patch.gz > /tmp/continuation.patch
          echo "a30ba8ed3b85b4a91c19a1cf523ff584122d8702162e4ada8bfb2bcfeaf2a2ff  /tmp/continuation.patch" | sha256sum -c -
          git apply --check /tmp/continuation.patch
          git apply --index /tmp/continuation.patch
          git rm -f -- .handoff/final-sprint-20261027.patch.gz .github/workflows/handbook-import.yml
          git diff --cached --check
          test "$(git write-tree)" = "eb9d8590f9f84097ba2e0746e9f031a1fb01471e"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: independent PDF review, controlled invoice delivery and full-scope release gate"
          git push origin HEAD:feature/final-sprint-handbook-20261027
