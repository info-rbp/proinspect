Foreground yes
User clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /dev/shm/clamav
LeaveTemporaryFiles no
LogSyslog no
LogClean no
LogVerbose no
MaxThreads 2
MaxQueue 4
StreamMaxLength 8M
MaxFileSize 8M
MaxScanSize 32M
MaxRecursion 12
MaxFiles 100
MaxScanTime 30000
AlertExceedsMax yes
AlertEncrypted yes
ScanPDF yes
ScanArchive yes
ConcurrentDatabaseReload no
SelfCheck 30
